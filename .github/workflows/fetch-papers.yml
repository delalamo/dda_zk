name: Fetch PubMed Papers

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC
  workflow_dispatch:

jobs:
  fetch-papers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dda_zk
        uses: actions/checkout@v4

      - name: Checkout PubMedFetcher
        uses: actions/checkout@v4
        with:
          repository: delalamo/PubMedFetcher
          path: PubMedFetcher

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: PubMedFetcher
        run: |
          pip install scikit-learn
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run PubMedFetcher
        working-directory: PubMedFetcher
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python run.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update PubMed paper data [skip ci]"
          git push
